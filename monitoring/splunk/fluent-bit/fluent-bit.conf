# M9 Task 9.3 log shipper: Docker fluentd log driver -> Splunk HEC. Settings come from the environment
# (docker-compose.splunk.yml); the HEC token is never in a file.
[SERVICE]
    Flush        2
    Log_Level    warn
    Parsers_File /fluent-bit/etc/mortgage/parsers.conf

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

# The service's stdout line is in "log": parse it into fields (the log contract). Non-JSON lines (a JVM banner,
# a crash before logging is configured) are kept as "log" so nothing is lost.
[FILTER]
    Name         parser
    Match        mortgage.*
    Key_Name     log
    Parser       json
    Reserve_Data On

[FILTER]
    Name    modify
    Match   mortgage.*
    Rename  container_name container
    Remove  container_id
    Remove  source

[OUTPUT]
    Name             splunk
    Match            mortgage.*
    Host             ${SPLUNK_HEC_HOST}
    Port             ${SPLUNK_HEC_PORT}
    Splunk_Token     ${SPLUNK_HEC_TOKEN}
    TLS              On
    TLS.Verify       ${SPLUNK_HEC_TLS_VERIFY}
    Event_Index      ${SPLUNK_INDEX}
    Event_Sourcetype mortgage:app:json
    Retry_Limit      5
