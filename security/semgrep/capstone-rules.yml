# Project-specific SAST rules (M6 Task 6.7). Each rule encodes a decision already documented in docs/security/.
# Severity ERROR blocks the merge; WARNING is reported only.
rules:
  - id: capstone-python-sql-fstring
    languages: [python]
    severity: ERROR
    message: SQL built with an f-string. Use text("... :param") with bound parameters (security-controls.md, Injection).
    pattern-either:
      - pattern: sqlalchemy.text(f"...")
      - pattern: text(f"...")
      - pattern: $DB.execute(f"...", ...)
      - pattern: $DB.execute(f"...")

  - id: capstone-python-sql-concat
    languages: [python]
    severity: ERROR
    message: SQL built by string concatenation or formatting. Use bound parameters.
    pattern-either:
      - pattern: text("..." + $X)
      - pattern: text("..." % $X)
      - pattern: text("...".format(...))
      - pattern: $DB.execute("..." + $X, ...)
      - pattern: $DB.execute("..." % $X, ...)

  - id: capstone-java-sql-concat
    languages: [java]
    severity: ERROR
    message: SQL built by string concatenation. Use ? placeholders (JdbcTemplate) or named parameters (JPA).
    pattern-either:
      - pattern: $JDBC.query("..." + $X, ...)
      - pattern: $JDBC.queryForList("..." + $X, ...)
      - pattern: $JDBC.queryForObject("..." + $X, ...)
      - pattern: $JDBC.update("..." + $X, ...)
      - pattern: $JDBC.execute("..." + $X)
      - pattern: $EM.createNativeQuery("..." + $X, ...)
      - pattern: $EM.createNativeQuery("..." + $X)
      - pattern: $EM.createQuery("..." + $X, ...)
      - pattern: $EM.createQuery("..." + $X)

  - id: capstone-python-jwt-no-verify
    languages: [python]
    severity: ERROR
    message: JWT decoded without signature verification. Tokens must be verified with algorithms=["HS256"] (authentication.md).
    pattern-either:
      - pattern: |
          jwt.decode(..., options={..., "verify_signature": False, ...}, ...)
      - pattern: jwt.decode(..., verify=False, ...)

  - id: capstone-python-tls-verify-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification disabled.
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: boto3.client(..., verify=False, ...)

  - id: capstone-ts-tls-verify-disabled
    languages: [typescript, javascript]
    severity: ERROR
    message: TLS certificate verification disabled.
    pattern-either:
      - pattern: |
          { ..., rejectUnauthorized: false, ... }
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: capstone-java-hardcoded-jwt-secret
    languages: [java]
    severity: ERROR
    message: JWT signing key hard-coded. It must come from the JWT_SECRET environment variable (runbook, secrets rotation).
    patterns:
      - pattern-either:
          - pattern: new SecretKeySpec("...".getBytes(...), ...)
          - pattern: new SecretKeySpec("...".getBytes(), ...)

  - id: capstone-log-authorization-header
    languages: [java]
    severity: ERROR
    message: Authorization header written to a log. Logs must stay Internal (security-controls.md, classification).
    pattern-either:
      - pattern: $LOG.$LEVEL(..., $REQ.getHeader("Authorization"), ...)
