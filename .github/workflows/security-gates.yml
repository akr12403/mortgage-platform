# Secure CI gates (M6 Task 6.7). Same checks as .gitlab-ci.yml; both call scripts/security-gates.sh.
# Branch protection on develop/main requires every job below to pass before a PR can merge
# (docs/operations/devsecops-baseline.md#how-a-merge-is-blocked).
name: security-gates

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret-detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history: a secret removed in a later commit is still a leak
      - run: sh scripts/security-gates.sh secrets
      - run: sh scripts/security-gates.sh selftest
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: gitleaks-report, path: reports/security/gitleaks.json, if-no-files-found: ignore }

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/security-gates.sh sast
      - run: python3 tests/security/test_static_sql.py
      - run: python3 tests/security/test_iam_policies.py   # M8: IAM least-privilege guard
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: semgrep-report, path: reports/security/semgrep.json, if-no-files-found: ignore }

  dependency-scanning:
    name: dependency-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/security-gates.sh sca
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: dependency-reports, path: "reports/security/*.txt", if-no-files-found: ignore }
