# M9 Task 9.1: the CI/CD pipeline (GitHub Actions; .gitlab-ci.yml is the documented equivalent).
# Guide: docs/operations/cicd.md
#
#   build -> unit tests ----------------------------\
#   secret-detection, sast, dependency-scanning -----> container-build -> container-scan -> integration-tests -> publish
#                                                                                                   (deploy: Task 9.1 part B)
# Images: ghcr.io/<owner>/mortgage-platform/<service>:sha-<7> for every run that reaches container-build;
# promoted to :develop / :main and to :<semver> for v* tags only after the scan and the integration tests pass.
# Security gates (secret-detection, sast, dependency-scanning) keep the M6 job names used by branch protection.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  # ------------------------------------------------------------------ Build
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Java services (compile + package, tests run in the next stage)
        run: |
          for s in mortgage-service servicing-service; do
            (cd services/$s && mvn -B -q -DskipTests package)
          done
      - name: TypeScript client (type-check + compile)
        working-directory: clients/mortgage-api-consumer
        run: npm ci --no-audit --no-fund && npm run build
      - name: Python sources compile
        run: python3 -m compileall -q analytics/mortgage-analytics-service/src ai/mortgage-knowledge-assistant/src infrastructure

  # ------------------------------------------------------------------ Unit tests
  unit-tests:
    name: unit-tests (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [mortgage-service, servicing-service, analytics-service, knowledge-assistant, ts-client, repo-checks]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        if: matrix.suite == 'mortgage-service' || matrix.suite == 'servicing-service'
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-node@v6
        if: matrix.suite == 'ts-client'
        with: { node-version: "22" }
      - uses: actions/setup-python@v6
        if: matrix.suite == 'repo-checks'
        with: { python-version: "3.14" }
      - name: Run ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/ci/unit-tests.sh "$SUITE"
      - name: Test summary
        if: always()
        run: python3 scripts/ci/junit_summary.py "unit-tests (${{ matrix.suite }})" reports/junit >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: "junit-${{ matrix.suite }}", path: reports/junit/, if-no-files-found: warn }

  # ------------------------------------------------------------------ Security gates (M6 Task 6.7)
  secrets:
    name: secret-detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history: a secret removed in a later commit is still a leak
      - run: sh scripts/security-gates.sh secrets
      - run: sh scripts/security-gates.sh selftest
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: gitleaks-report, path: reports/security/gitleaks.json, if-no-files-found: ignore }

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/security-gates.sh sast
      - run: python3 tests/security/test_static_sql.py
      - run: python3 tests/security/test_iam_policies.py   # M8: IAM least-privilege guard
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: semgrep-report, path: reports/security/semgrep.json, if-no-files-found: ignore }

  dependency-scanning:
    name: dependency-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/security-gates.sh sca
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: dependency-reports, path: "reports/security/*.txt", if-no-files-found: ignore }

  # ------------------------------------------------------------------ Container build (push sha tag)
  container-build:
    name: container-build (${{ matrix.service }})
    needs: [unit-tests, secrets, sast, dependency-scanning]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [mortgage-service, servicing-service, analytics-service, knowledge-assistant]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push ${{ matrix.service }}:sha-${{ github.sha }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          target: ${{ (matrix.service == 'analytics-service' || matrix.service == 'knowledge-assistant') && 'runtime' || '' }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------------------------------------------------ Container scan (fail on fixable Critical)
  container-scan:
    name: container-scan (${{ matrix.service }})
    needs: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [mortgage-service, servicing-service, analytics-service, knowledge-assistant]
    steps:
      - uses: actions/checkout@v6
      - name: Trivy image scan (policy in docs/operations/cicd.md#container-scan-policy)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/container-scan.sh "$IMAGE" "${{ matrix.service }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: "container-scan-${{ matrix.service }}", path: reports/security/trivy-image-*, if-no-files-found: ignore }

  # ------------------------------------------------------------------ Integration tests (the scanned images, full stack)
  integration-tests:
    name: integration-tests
    needs: container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Start the compose stack from the pipeline's images, run the smoke and contract tests
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: bash scripts/ci/integration-tests.sh
      - name: Test summary
        if: always()
        run: python3 scripts/ci/junit_summary.py "integration-tests" reports/junit >> "$GITHUB_STEP_SUMMARY"
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color > reports/compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: integration-reports, path: "reports/junit/\nreports/compose-logs.txt", if-no-files-found: warn }
      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans || true

  # ------------------------------------------------------------------ Publish (promote tested images)
  publish:
    name: publish
    needs: integration-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Promote sha-${{ github.sha }} (no rebuild; same digest)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_TYPE" in
            tag)    extra="${REF_NAME#v}" ;;   # v1.4.2 -> 1.4.2
            *)      extra="$REF_NAME" ;;       # develop / main
          esac
          for s in mortgage-service servicing-service analytics-service knowledge-assistant; do
            src="$IMAGE_PREFIX/$s:sha-$GITHUB_SHA"
            docker buildx imagetools create --tag "$IMAGE_PREFIX/$s:$extra" "$src"
            digest=$(docker buildx imagetools inspect "$src" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "| \`$s\` | \`sha-${GITHUB_SHA::7}…\`, \`$extra\` | \`${digest:0:19}…\` |" >> "$RUNNER_TEMP/rows.md"
          done
          { echo "### Published images"; echo; echo "| Image | Tags | Digest |"; echo "| --- | --- | --- |"; cat "$RUNNER_TEMP/rows.md"; } >> "$GITHUB_STEP_SUMMARY"
