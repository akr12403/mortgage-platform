# M8 override (Tasks 8.2 + 8.4): analytics-service uses REAL AWS for S3 (document uploads) and DynamoDB (mortgage
# lookup + event-driven cache updates); everything else (PostgreSQL, SNS/SQS on LocalStack, the other services) is
# unchanged. Do not run this file directly. Use:
#   aws login --profile capstone-dev --region us-east-2
#   bash scripts/aws/compose-aws-up.sh
# That script assumes mortgage-analytics-role for 1 hour and passes the temporary credentials through the
# environment only (never written to a file). When they expire, uploads return 502 S3_UPLOAD_ERROR, lookups return
# 503 LOOKUP_UNAVAILABLE and events stay on the queue for retry: run the script again.
services:
  analytics-service:
    environment:
      AWS_ACCESS_KEY_ID: ${M8_ANALYTICS_AWS_ACCESS_KEY_ID:?run scripts/aws/compose-aws-up.sh}
      AWS_SECRET_ACCESS_KEY: ${M8_ANALYTICS_AWS_SECRET_ACCESS_KEY:?run scripts/aws/compose-aws-up.sh}
      AWS_SESSION_TOKEN: ${M8_ANALYTICS_AWS_SESSION_TOKEN:?run scripts/aws/compose-aws-up.sh}
      S3_ENDPOINT_URL: ""
      S3_REGION: ${M8_AWS_REGION:-us-east-2}
      S3_BUCKET_DOCUMENTS: ${M8_DOCS_BUCKET:-capstone-mortgage-docs-dev}
      DYNAMODB_ENDPOINT_URL: ""
      DYNAMODB_REGION: ${M8_AWS_REGION:-us-east-2}
      DYNAMODB_LOOKUP_TABLE: ${M8_LOOKUP_TABLE:-CapstoneMortgageLookup-dev}
