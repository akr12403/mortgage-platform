openapi: 3.0.3
info:
  title: mortgage-analytics-service API
  version: v1
  description: |
    Portfolio analytics over the canonical PostgreSQL tables, document upload (M3), and the optional
    lifecycle-event consumer (SQS capstone-mortgage-analytics-dev). FastAPI also serves its generated
    spec at /openapi.json; this file is the reviewed contract. Breaking-change policy: ADR-002.
    M6: every operation except /health requires `Authorization: Bearer <jwt>` issued by mortgage-service
    POST /api/v1/auth/login, plus one of the roles in `x-roles`. 401 UNAUTHORIZED / INVALID_TOKEN, 403 ACCESS_DENIED.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health (used by the container HEALTHCHECK)
      operationId: health
      security: []
      responses:
        '200':
          description: UP
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
                  service: { type: string, example: mortgage-analytics-service }
  /api/v1/analytics/portfolio-summary:
    get:
      summary: Portfolio counts, balance and delinquency rate
      description: delinquencyRate = DELINQUENT / (ACTIVE + DELINQUENT), per guides/standards.md.
      operationId: getPortfolioSummary
      x-roles: [ADMIN, UNDERWRITER, RISK_ANALYST]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioSummary' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/analytics/delinquency:
    get:
      summary: Delinquent mortgages with their snapshot
      operationId: getDelinquencies
      x-roles: [ADMIN, UNDERWRITER, RISK_ANALYST]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Delinquent mortgages
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  delinquentMortgages:
                    type: array
                    items:
                      type: object
                      properties:
                        mortgageExternalId: { type: string }
                        status: { type: string }
                        delinquentSince: { type: string, format: date }
                        daysPastDue: { type: integer }
                        severity: { type: string }
  /api/v1/analytics/borrowers/{borrowerExternalId}/risk-summary:
    get:
      summary: Borrower risk summary
      operationId: getBorrowerRisk
      x-roles: [ADMIN, UNDERWRITER, RISK_ANALYST]
      parameters:
        - name: borrowerExternalId
          in: path
          required: true
          schema: { type: string, pattern: '^BOR-\d{3}$', example: BOR-001 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  borrowerExternalId: { type: string }
                  firstName: { type: string, description: 'Only for roles in BORROWER_PII_READ (ADMIN, UNDERWRITER); omitted for RISK_ANALYST (DP-GAP-1)' }
                  lastName: { type: string, description: 'Only for roles in BORROWER_PII_READ (ADMIN, UNDERWRITER); omitted for RISK_ANALYST (DP-GAP-1)' }
                  totalMortgages: { type: integer, description: ACTIVE + DELINQUENT }
                  totalOutstandingBalance: { type: number }
                  delinquentCount: { type: integer }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/analytics/payment-trends:
    get:
      summary: Monthly posted amount and on-time rate
      operationId: getPaymentTrends
      x-roles: [ADMIN, UNDERWRITER, RISK_ANALYST]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date, example: '2025-01-01' } }
        - { name: to, in: query, required: true, schema: { type: string, format: date, example: '2026-12-31' } }
      description: from must be on or before to and the range is at most 3660 days (else 400 VALIDATION_ERROR).
      responses:
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Buckets by month
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        period: { type: string, example: 2026-01 }
                        postedAmount: { type: number, example: 22000.00 }
                        onTimeRate: { type: number, example: 0.95 }
  /api/v1/analytics/event-stats:
    get:
      summary: Lifecycle events consumed and the last refreshed portfolio snapshot
      operationId: getEventStats
      x-roles: [ADMIN, UNDERWRITER, RISK_ANALYST]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Consumer statistics ({"consumerEnabled":false} when SQS_QUEUE_ANALYTICS_EVENTS is unset)
          content:
            application/json:
              schema:
                type: object
                properties:
                  consumerEnabled: { type: boolean }
                  eventsProcessed:
                    type: object
                    additionalProperties: { type: integer }
                    example: { MortgageCreated: 1, PaymentReceived: 2 }
                  duplicatesIgnored: { type: integer }
                  failures: { type: integer }
                  lastEvent:
                    type: object
                    nullable: true
                    properties:
                      eventId: { type: string, format: uuid }
                      eventType: { type: string }
                      mortgageExternalId: { type: string }
                      correlationId: { type: string }
                      occurredAt: { type: string, format: date-time }
                  portfolioSnapshot:
                    allOf: [{ $ref: '#/components/schemas/PortfolioSummary' }]
                    nullable: true
                  snapshotRefreshedAt: { type: string, format: date-time, nullable: true }
                  lookupUpdates:
                    type: object
                    description: M8 Task 8.4 DynamoDB lookup update outcomes (only when DYNAMODB_LOOKUP_TABLE is set)
                    additionalProperties: { type: integer }
                    example: { UPDATED: 3, STALE: 1 }
  /api/v1/analytics/curated/delinquency-report:
    get:
      summary: Delinquency report from the curated data lake zone (M8 Task 8.5)
      description: >-
        Reads s3://capstone-mortgage-analytics-dev/curated/delinquency_report/date=YYYY-MM-DD/ (written only by the
        Glue job) and summarises it. Latest partition when date is omitted. Requires the AWS mode
        (scripts/aws/compose-aws-up.sh); otherwise 503.
      operationId: getCuratedDelinquencyReport
      x-roles: [ADMIN, UNDERWRITER, RISK_ANALYST]
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-11-04' }
      responses:
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }   # CURATED_SCHEMA_MISMATCH
        '503': { $ref: '#/components/responses/Error' }   # CURATED_UNAVAILABLE
        '200':
          description: Report summary for one partition
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportDate: { type: string, format: date }
                  mortgageCount: { type: integer }
                  delinquentCount: { type: integer }
                  delinquencyRate: { type: number, example: 0.2222 }
                  outstandingBalanceTotal: { type: number }
                  balanceAtRisk: { type: number, description: Outstanding balance of delinquent mortgages }
                  byRiskBucket:
                    type: object
                    additionalProperties:
                      type: object
                      properties: { count: { type: integer }, outstandingBalance: { type: number } }
                    example: { CURRENT: { count: 14, outstandingBalance: 4200000.0 }, DPD_90_PLUS: { count: 1, outstandingBalance: 277150.0 } }
                  bySeverity: { type: object, additionalProperties: { type: integer } }
                  mostPastDue:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      properties:
                        mortgageExternalId: { type: string }
                        daysPastDue: { type: integer }
                        severity: { type: string }
                        outstandingBalance: { type: number }
                  source:
                    type: object
                    properties:
                      location: { type: string, example: 's3://capstone-mortgage-analytics-dev/curated/delinquency_report/date=2026-11-04/part-0000.csv' }
                      dataset: { type: string }
                      schemaVersion: { type: integer }
                      generatedAt: { type: string, format: date-time }
                      pipelineRunId: { type: string, example: pr-20261104T005200Z-1a2b3c4d }
                      manifestRowCount: { type: integer }
  /api/v1/analytics/curated/delinquency-report/dates:
    get:
      summary: Curated report partitions available
      operationId: listCuratedDelinquencyReportDates
      x-roles: [ADMIN, UNDERWRITER, RISK_ANALYST]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Error' }
        '200':
          description: Dates with a curated partition, ascending
          content:
            application/json:
              schema:
                type: object
                properties:
                  dates: { type: array, items: { type: string, format: date } }
  /api/v1/lookup/mortgages/{mortgageExternalId}:
    get:
      summary: Mortgage status and balance by ID from the DynamoDB lookup table (M8 Task 8.4)
      description: >-
        Single GetItem on CapstoneMortgageLookup-dev (PK mortgageExternalId), eventually consistent. The table is
        bulk-loaded from PostgreSQL and kept current by lifecycle events; no borrower PII is stored. Available when
        the service runs with DYNAMODB_LOOKUP_TABLE (scripts/aws/compose-aws-up.sh); otherwise 503.
      operationId: lookupMortgage
      x-roles: [ADMIN, UNDERWRITER, SERVICING_AGENT, RISK_ANALYST]
      parameters:
        - name: mortgageExternalId
          in: path
          required: true
          schema: { type: string, pattern: '^MTG-\d{4}$', example: MTG-1002 }
      responses:
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }   # LOOKUP_UNAVAILABLE: not configured, unreachable or credentials expired
        '200':
          description: Cached mortgage state
          content:
            application/json:
              schema:
                type: object
                required: [mortgageExternalId, status, outstandingBalance, lookupSource]
                properties:
                  mortgageExternalId: { type: string, example: MTG-1002 }
                  borrowerExternalId: { type: string, example: BOR-002 }
                  status: { type: string, enum: [PENDING, ACTIVE, DELINQUENT, CLOSED] }
                  outstandingBalance: { type: number, example: 198250.5 }
                  originalAmount: { type: number }
                  originationDate: { type: string, format: date }
                  lastPaymentDate: { type: string, format: date }
                  daysPastDue: { type: integer }
                  delinquencySeverity: { type: string, enum: [MODERATE, SEVERE, CRITICAL] }
                  lastEventType: { type: string, example: PaymentReceived }
                  lastEventAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
                  source: { type: string, enum: [pg-bulk-load, event] }
                  lookupSource: { type: string, enum: [dynamodb] }
                  lookupMs: { type: number, example: 12.4 }
  /api/v1/documents/upload:
    post:
      summary: Upload a mortgage document to S3 and record its metadata (M3)
      operationId: uploadDocument
      x-roles: [ADMIN, UNDERWRITER, SERVICING_AGENT]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [mortgage_external_id, document_type, file]
              properties:
                mortgage_external_id: { type: string, pattern: '^MTG-\d{4}$', example: MTG-1001 }
                document_type: { type: string, pattern: '^[A-Z][A-Z_]{1,39}$', example: INCOME_VERIFICATION }
                file:
                  type: string
                  format: binary
                  description: >-
                    Max 10 MB (413 PAYLOAD_TOO_LARGE). Allowed types application/pdf, image/png, image/jpeg, text/plain,
                    checked against the file's leading bytes (415 UNSUPPORTED_MEDIA_TYPE). The filename is sanitised.
                    Limited to 20 uploads per user per minute (429 RATE_LIMITED).
      responses:
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId: { type: string, format: uuid }
                  mortgageExternalId: { type: string }
                  s3Key: { type: string }
                  status: { type: string, example: UPLOADED }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by mortgage-service POST /api/v1/auth/login (same JWT_SECRET and issuer).
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing (UNAUTHORIZED) or invalid/expired/tampered (INVALID_TOKEN) bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: UNAUTHORIZED }
              message: { type: string }
              correlationId: { type: string }
              timestamp: { type: string, format: date-time }
    Forbidden:
      description: Authenticated but the caller's role is not allowed (code ACCESS_DENIED); see x-roles
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: ACCESS_DENIED }
              message: { type: string }
              correlationId: { type: string }
              timestamp: { type: string, format: date-time }
    Error:
      description: Shared error envelope (guides/standards.md)
      content:
        application/json:
          schema:
            type: object
            required: [code, message, correlationId, timestamp]
            properties:
              code: { type: string, example: NOT_FOUND }
              message: { type: string }
              correlationId: { type: string }
              timestamp: { type: string, format: date-time }
  schemas:
    PortfolioSummary:
      type: object
      properties:
        totalMortgages: { type: integer, example: 12 }
        activeMortgages: { type: integer, example: 10 }
        delinquentMortgages: { type: integer, example: 2 }
        outstandingBalanceTotal: { type: number, example: 3842500.00 }
        delinquencyRate: { type: number, example: 0.2 }
        asOf: { type: string, format: date-time }
