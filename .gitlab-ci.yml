# GitLab CI equivalent of .github/workflows/ci.yml (M9 Task 9.1). The project runs on GitHub Actions; this file
# documents the same pipeline for GitLab and calls the same scripts, so both behave identically.
# Guide: docs/operations/cicd.md. Merge blocking: Settings > Merge requests > "Pipelines must succeed".
#
#   build -> test -> security (sast, sca, secrets) -> container (build, scan) -> integration (+ e2e) -> publish -> deploy
# Deploy: dev automatic on develop; test plan manual; prod dry run manual; nightly drift check (scheduled pipeline).
# AWS via GitLab OIDC (id_tokens) -> the same roles as GitHub would need a GitLab trust statement (not provisioned).

stages:
  - build
  - test
  - security
  - container
  - integration
  - publish
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  IMAGE_PREFIX: "$CI_REGISTRY_IMAGE"          # GitLab container registry of this project
  IMAGE_TAG: "sha-$CI_COMMIT_SHA"
  DOCKER_TLS_CERTDIR: "/certs"

cache:
  key: maven
  paths: [.m2/repository]

.docker:
  image: docker:28
  services: ["docker:28-dind"]
  before_script:
    - apk add --no-cache bash python3 curl
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# ------------------------------------------------------------------ Build
build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - (cd services/mortgage-service && mvn -B -q -DskipTests package)
    - (cd services/servicing-service && mvn -B -q -DskipTests package)

build-ts:
  stage: build
  image: node:22
  script:
    - cd clients/mortgage-api-consumer && npm ci --no-audit --no-fund && npm run build

# ------------------------------------------------------------------ Unit tests (JUnit reports shown in the MR)
.unit:
  stage: test
  script:
    - bash scripts/ci/unit-tests.sh "$SUITE"
  artifacts:
    when: always
    reports:
      junit: reports/junit/*.xml
    expire_in: 30 days

unit-java:
  extends: .unit
  image: maven:3.9-eclipse-temurin-17
  parallel:
    matrix:
      - SUITE: [mortgage-service, servicing-service]

unit-python:
  extends: [.unit, .docker]
  parallel:
    matrix:
      - SUITE: [analytics-service, knowledge-assistant]

unit-ts:
  extends: .unit
  image: node:22
  variables: { SUITE: ts-client }

unit-repo-checks:
  extends: .unit
  image: python:3.14.7-slim
  variables: { SUITE: repo-checks }
  before_script:
    - apt-get update -qq && apt-get install -y -qq bash >/dev/null

# ------------------------------------------------------------------ Security gates (M6 Task 6.7)
secret_detection:
  stage: security
  image: { name: "zricethezav/gitleaks:v8.30.1", entrypoint: [""] }
  variables: { GIT_DEPTH: "0" }
  script:
    - sh scripts/security-gates.sh secrets
    - sh scripts/security-gates.sh selftest
  artifacts: { when: always, paths: [reports/security/gitleaks.json], expire_in: 30 days }

sast:
  stage: security
  image: semgrep/semgrep:1.178.0
  script:
    - sh scripts/security-gates.sh sast
  artifacts: { when: always, paths: [reports/security/semgrep.json], expire_in: 30 days }

dependency_scanning:
  stage: security
  extends: .docker
  script:
    - sh scripts/security-gates.sh sca
  artifacts: { when: always, paths: ["reports/security/*.txt"], expire_in: 30 days }

# ------------------------------------------------------------------ Container build + scan
container_build:
  stage: container
  extends: .docker
  parallel:
    matrix:
      - SERVICE: [mortgage-service, servicing-service, analytics-service, knowledge-assistant]
  script:
    - TARGET=""; case "$SERVICE" in analytics-service|knowledge-assistant) TARGET="--target runtime" ;; esac
    - docker build $TARGET -f "docker/Dockerfile.$SERVICE" -t "$IMAGE_PREFIX/$SERVICE:$IMAGE_TAG"
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" .
    - docker push "$IMAGE_PREFIX/$SERVICE:$IMAGE_TAG"

container_scan:
  stage: container
  extends: .docker
  needs: [container_build]
  parallel:
    matrix:
      - SERVICE: [mortgage-service, servicing-service, analytics-service, knowledge-assistant]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - bash scripts/ci/container-scan.sh "$IMAGE_PREFIX/$SERVICE:$IMAGE_TAG" "$SERVICE"
  artifacts: { when: always, paths: ["reports/security/trivy-image-*"], expire_in: 30 days }

# ------------------------------------------------------------------ Integration tests (scanned images, full stack)
integration_tests:
  stage: integration
  extends: .docker
  script:
    - apk add --no-cache docker-cli-compose py3-pip
    - IMAGE_PREFIX="$IMAGE_PREFIX" bash scripts/ci/integration-tests.sh
  after_script:
    - docker compose logs --no-color > reports/compose-logs.txt 2>&1 || true
    - docker compose down -v || true
  artifacts:
    when: always
    reports: { junit: reports/junit/*.xml }
    paths: [reports/compose-logs.txt]
    expire_in: 30 days

# M10: the five Cucumber journeys J1-J5 (tests/e2e) on the same images, in the same stage (both gate publish).
e2e_tests:
  stage: integration
  extends: .docker
  variables:
    COMPOSE_FILE: "docker-compose.yml:tests/e2e/docker-compose.e2e.yml"
    E2E_TLS_DIR: "$CI_PROJECT_DIR/reports/e2e/tls"
  script:
    - apk add --no-cache docker-cli-compose openssl nodejs npm
    - IMAGE_PREFIX="$IMAGE_PREFIX" bash scripts/ci/e2e-tests.sh
  after_script:
    - docker compose logs --no-color > reports/compose-logs.txt 2>&1 || true
    - docker compose down -v || true
  artifacts:
    when: always
    reports: { junit: reports/junit/e2e-cucumber.xml }
    paths: [reports/e2e/cucumber-report.html, reports/compose-logs.txt]
    expire_in: 30 days

# ------------------------------------------------------------------ Publish (promote tested images, no rebuild)
publish:
  stage: publish
  extends: .docker
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      variables: { EXTRA_TAG: "$CI_COMMIT_BRANCH" }
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - EXTRA_TAG="${EXTRA_TAG:-${CI_COMMIT_TAG#v}}"
    - for s in mortgage-service servicing-service analytics-service knowledge-assistant; do
        docker buildx imagetools create --tag "$IMAGE_PREFIX/$s:$EXTRA_TAG" "$IMAGE_PREFIX/$s:$IMAGE_TAG";
      done

# ------------------------------------------------------------------ Deploy (Task 9.1 part B; same scripts as .github/workflows)
.aws:
  image: hashicorp/terraform:1.17.1
  id_tokens:
    AWS_ID_TOKEN: { aud: sts.amazonaws.com }
  variables:
    AWS_REGION: us-east-2
    TF_IN_AUTOMATION: "1"
    TF_VAR_developer_principal_arn: $TF_DEVELOPER_PRINCIPAL_ARN   # masked CI/CD variable
  before_script:
    - apk add --no-cache bash aws-cli docker-cli
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "gitlab-$CI_JOB_ID"
      --web-identity-token "$AWS_ID_TOKEN" --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text))

deploy_dev:
  stage: deploy
  extends: .aws
  services: ["docker:28-dind"]
  variables: { AWS_ROLE_ARN: $AWS_DEPLOY_DEV_ROLE_ARN, TF_VAR_image_tag: "sha-$CI_COMMIT_SHA" }
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE != "schedule"
  resource_group: deploy-dev
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - bash scripts/ci/promote-to-ecr.sh dev "sha-$CI_COMMIT_SHA"
    - bash scripts/terraform/tf.sh dev init
    - bash scripts/terraform/tf.sh dev apply -input=false -auto-approve -lock-timeout=120s

.plan:
  stage: deploy
  extends: .aws
  variables: { AWS_ROLE_ARN: $AWS_PLAN_ROLE_ARN }
  script:
    - export TF_VAR_image_tag="$(bash scripts/ci/current-image-tag.sh "$ENV_NAME")"
    - bash scripts/terraform/tf.sh "$ENV_NAME" init
    - bash scripts/terraform/tf.sh "$ENV_NAME" plan -input=false -lock-timeout=120s

plan_test:
  extends: .plan
  variables: { ENV_NAME: test }
  rules: [{ if: $CI_COMMIT_BRANCH == "develop", when: manual, allow_failure: true }]

prod_dry_run:
  extends: .plan
  variables: { ENV_NAME: prod }
  rules: [{ if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop", when: manual, allow_failure: true }]

drift_dev:
  extends: .plan
  variables: { ENV_NAME: dev }
  rules: [{ if: $CI_PIPELINE_SOURCE == "schedule" }]
  script:
    - export TF_VAR_image_tag="$(bash scripts/ci/current-image-tag.sh dev)"
    - bash scripts/terraform/tf.sh dev init
    - bash scripts/terraform/tf.sh dev plan -input=false -lock-timeout=120s -detailed-exitcode
