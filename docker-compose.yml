version: '3.8'

services:
  postgres:
    image: postgres:17.7
    container_name: capstone-postgres
    environment:
      POSTGRES_USER: mortgage_app
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mortgage_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortgage_app -d mortgage_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: capstone-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs
      - AWS_DEFAULT_REGION=us-east-1

  mortgage-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.mortgage-service
    container_name: mortgage-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  servicing-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.servicing-service
    container_name: servicing-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-service:
      build:
        context: .
        dockerfile: docker/Dockerfile.analytics-service
      container_name: analytics-service
      ports:
        - "8000:8000"
      environment:
        - POSTGRES_HOST=postgres
        - POSTGRES_PORT=5432
        - POSTGRES_DB=mortgage_intel
        - POSTGRES_USER=mortgage_app
        - POSTGRES_PASSWORD=postgres
        - AWS_ENDPOINT_URL=http://localstack:4566
      depends_on:
        postgres:
          condition: service_healthy

volumes:
  postgres_data: