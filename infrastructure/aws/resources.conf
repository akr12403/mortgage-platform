# M8 AWS sandbox: resource names and settings (no secrets, no account id).
# Read by scripts/aws/lib.sh. Any value can be overridden by exporting it before running a script,
# e.g. DOCS_BUCKET=capstone-mortgage-docs-dev-ak bash scripts/aws/iam-apply.sh (S3 names are global).
# Names follow guides/standards.md "AWS resource naming": capstone-mortgage-{resource}-{env}.

AWS_SANDBOX_PROFILE=capstone-dev
# The AWS project "Try Catch Finally" is pinned to us-east-2 (new AWS experience: one Region per project).
# LocalStack (docker compose) stays on us-east-1 via AWS_REGION in .env; the two never mix.
AWS_SANDBOX_REGION=us-east-2

# S3 (Task 8.2): documents uploaded by mortgage-analytics-service, and the analytics data lake (Task 8.5)
DOCS_BUCKET=capstone-mortgage-docs-dev
DOCS_UPLOAD_PREFIX=mortgages/
ANALYTICS_BUCKET=capstone-mortgage-analytics-dev
RAW_PREFIX=raw/pg-export/
CURATED_PREFIX=curated/delinquency_report/
GLUE_ASSETS_PREFIX=glue/

# Messaging (M5 topology; real-AWS copies in Task 8.4)
LIFECYCLE_TOPIC=capstone-mortgage-lifecycle-dev
SERVICING_QUEUE=capstone-mortgage-servicing-dev
ANALYTICS_QUEUE=capstone-mortgage-analytics-dev

# DynamoDB (Task 8.4 lookup, Task 8.3 document metadata)
LOOKUP_TABLE=CapstoneMortgageLookup-dev
DOC_METADATA_TABLE=CapstoneMortgageDocumentMetadata-dev

# Compute
LAMBDA_FUNCTION=capstone-mortgage-doc-processor-dev
GLUE_JOB=capstone-mortgage-delinquency-etl-dev

# Tags on every resource (guides/standards.md)
TAG_PROJECT=mortgage-intelligence
TAG_ENVIRONMENT=dev
TAG_TEAM=capstone
