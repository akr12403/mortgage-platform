server:
  port: 8080

spring:
  application:
    name: mortgage-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mortgage_intel}
    username: ${POSTGRES_USER:mortgage_app}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

aws:
  region: ${AWS_REGION:us-east-1}
  # Set only for LocalStack (e.g. http://localstack:4566). Leave empty for real AWS.
  endpoint-url: ${AWS_ENDPOINT_URL:}
  sns:
    topic-arn: ${SNS_TOPIC_MORTGAGE_EVENTS:arn:aws:sns:us-east-1:000000000000:capstone-mortgage-lifecycle-dev}

app:
  delinquency:
    # Daily batch for the 30-day delinquency rule (UTC). Also triggerable via POST /api/v1/delinquency-evaluations.
    scan-cron: ${DELINQUENCY_SCAN_CRON:0 0 2 * * *}
